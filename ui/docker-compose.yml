# The apps on their own, with their own Qdrant. Nothing here needs the API or
# the root stack, and nothing in the root stack needs this. From `ui/`:
#
#   docker compose up
#
# - upload  → localhost:8501
# - chat    → localhost:8502

x-app: &app
  build:
    # The repository root, since the apps run the service's code in process.
    context: ..
    dockerfile: ui/Dockerfile
  volumes:
    # Mounted, so an edit reruns without a rebuild.
    - ../src:/app/src
    - .:/app/ui
    - ../data:/app/data:ro
  # The root .env: the same configuration the API reads.
  env_file: ../.env
  environment:
    QDRANT_URL: http://qdrant:6333
  depends_on:
    - qdrant

services:
  # Its own database, with its own data. No ports published, so it never
  # collides with the root stack's Qdrant on 6333.
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./qdrant_storage:/qdrant/storage

  upload:
    <<: *app
    command: >
      streamlit run ui/upload_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"

  chat:
    <<: *app
    command: >
      streamlit run ui/chat_app.py
      --server.port 8502
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8502:8502"
